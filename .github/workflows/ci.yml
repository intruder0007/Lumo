name: CI

on:
  pull_request:
    branches: [main, architecture, cli, core, templates, plugins, sdk, tests]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      # tests/integration's TestEndToEndGenerateNodeRestAPI/
      # TypeScriptRestAPI need a real node/npm on PATH — explicit rather
      # than relying on whatever ubuntu-latest happens to ship, so a
      # runner-image change can't silently start skipping either
      # cross-language proof.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # tests/integration's TestEndToEndGenerateRustRestAPI needs cargo
      # on PATH, same reasoning as setup-node above. The Rust template
      # itself has no crates.io dependencies, so this is the only
      # network access its verification needs.
      - uses: dtolnay/rust-toolchain@stable

      # cpp-cli's TestEndToEndGenerateCppCLI needs g++ + make; both ship
      # on ubuntu-latest by default (no dedicated setup action needed —
      # see docs/templates/authoring.md and the D1 PR description for
      # why C++ intentionally has no CMake dependency here).

      # tests/integration's TestEndToEndGeneratePythonRestAPI needs a
      # real python3 on PATH, same reasoning as setup-node above. This
      # template was written without a working local Python interpreter
      # (see templates/python-rest-api/main.go) — this is genuinely the
      # first place it gets run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tests/integration's TestEndToEndGenerateJavaRestAPI needs
      # javac/java on PATH. Same "written without a local JDK, CI is
      # the first real run" situation as Python above (see
      # templates/java-rest-api/main.go). A JDK setup here also covers
      # the Kotlin template that follows in a later PR, since kotlinc
      # needs a JDK underneath it.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # kotlin-cli's TestEndToEndGenerateKotlinCLI needs kotlinc on
      # PATH. There's no official actions/setup-kotlin, so this
      # installs the compiler directly from JetBrains' own GitHub
      # releases (a pinned version, not a third-party Action) rather
      # than trusting an unverified community action for a compiler
      # toolchain. Same "written without a local Kotlin compiler, CI
      # is the first real run" situation as Python/Java above (see
      # templates/kotlin-cli/main.go).
      - name: Install Kotlin compiler
        run: |
          KOTLIN_VERSION=2.0.21
          curl -sSL -o kotlinc.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q kotlinc.zip -d "$HOME/kotlinc-install"
          echo "$HOME/kotlinc-install/kotlinc/bin" >> "$GITHUB_PATH"

      # csharp-rest-api's TestEndToEndGenerateCSharpRestAPI needs a
      # working dotnet on PATH, same "written without a working local
      # .NET SDK, CI is the first real run" situation as
      # Python/Java/Kotlin above (see
      # templates/csharp-rest-api/main.go).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # tests/integration exercises the git-init capability plugin,
      # which runs `git commit`; a fresh runner has no git identity
      # configured (developer machines usually already have one, so
      # this only ever surfaces in CI).
      - name: Configure git identity for the integration test
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # go.work only exists once the cli branch has merged; guard so PRs
      # against earlier branches (architecture/sdk/core/...) don't fail
      # trying to build modules that aren't present yet.
      #
      # templates/registry.txt is the single source of truth for which
      # template modules exist (see Makefile) — module lists here are
      # built from it instead of hardcoding each template by name, so
      # adding a language doesn't require touching this workflow.
      - name: Build & vet present modules
        run: |
          modules="cli core sdk/go"
          if [ -f templates/registry.txt ]; then
            while IFS= read -r t; do
              [ -n "$t" ] && modules="$modules templates/$t"
            done < templates/registry.txt
          fi
          modules="$modules plugins/builtin/git-init plugins/builtin/readme plugins/builtin/github-actions-ci tests"
          for m in $modules; do
            if [ -f "$m/go.mod" ]; then
              echo "== $m =="
              (cd "$m" && go build ./... && go vet ./...)
            fi
          done

      - name: Test present modules
        run: |
          modules="cli core sdk/go"
          if [ -f templates/registry.txt ]; then
            while IFS= read -r t; do
              [ -n "$t" ] && modules="$modules templates/$t"
            done < templates/registry.txt
          fi
          modules="$modules plugins/builtin/git-init plugins/builtin/readme plugins/builtin/github-actions-ci tests"
          for m in $modules; do
            if [ -f "$m/go.mod" ]; then
              echo "== $m =="
              (cd "$m" && go test ./...)
            fi
          done

      # Catches dependency-level vulnerabilities (e.g. GO-2026-5024) that
      # `go vet`/`go test` don't check for. Scoped to cli and core only —
      # sdk/go, templates/*, and plugins/builtin/* are checked separately
      # if/when they grow their own third-party dependencies; today they
      # have none.
      - name: Vulnerability scan (govulncheck)
        run: |
          for m in cli core; do
            echo "== $m =="
            (cd "$m" && go run golang.org/x/vuln/cmd/govulncheck@latest ./...)
          done

      # make build runs the real staging pipeline (stage-embedded -> build
      # cli with the plugin set embedded via go:embed) and produces the
      # self-sufficient bin/lumo every release archive ships. The
      # module-by-module steps above can't catch staging or go:embed
      # problems, so the actual pipeline must be exercised too. Guarded on
      # go.work existing, same as the module steps above (it only exists
      # once the cli branch has merged). Leaves a dirty tree (staged
      # assets + built binaries are gitignored) but CI never commits, so
      # that's harmless.
      - name: Build via Makefile (staged embedded pipeline)
        run: |
          if [ -f go.work ]; then
            make build
          fi

      # CONTRIBUTING.md documents this check; it must actually run.
      - name: Lint docs (markdownlint)
        run: npx --yes markdownlint-cli 'docs/**/*.md' 'README.md' 'CONTRIBUTING.md' 'CHANGELOG.md' 'CODE_OF_CONDUCT.md'
